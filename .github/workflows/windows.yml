name: Windows

on:
  push:
  pull_request:

jobs:
  package:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install Inno Setup build tool
        run: |
          $ErrorActionPreference = 'Stop'
          $root = New-Item -Path build -ItemType Directory -Force
          $tool = Join-Path $root.FullName 'inno-setup.exe'
          $target = Join-Path $root.FullName 'InnoSetup'
          Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-6_5_4/innosetup-6.5.4.exe' -OutFile $tool
          $sig = Get-AuthenticodeSignature -LiteralPath $tool
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'Pyrsys') { throw 'Unexpected Inno Setup signature' }
          $proc = Start-Process -FilePath $tool -ArgumentList @('/PORTABLE=1','/CURRENTUSER','/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',('/DIR="' + $target + '"')) -WindowStyle Hidden -PassThru -Wait
          if ($proc.ExitCode -ne 0) { throw "Inno Setup returned $($proc.ExitCode)" }
      - name: Test and build the x64 installer
        env:
          PYTHONUTF8: '1'
          GAOMENHU_UI_TEST: '1'
        run: .\build.ps1 -InnoSetup .\build\InnoSetup\ISCC.exe
      - name: Smoke-test installation, registry, WebView2, and uninstall
        run: |
          $version = (Get-Content -Raw -LiteralPath '..\VERSION').Trim()
          $build = (Get-Content -Raw .\build\release-assets\version.txt).Trim().Split('.')[-1]
          .\tests\install-smoke.ps1 -Setup ".\dist\GaoMenHu-Windows-$version-build$build-x64-Setup.exe" -Register
      - uses: actions/upload-artifact@v4
        with:
          name: GaoMenHu-Windows-x64
          if-no-files-found: error
          path: |
            windows/dist/GaoMenHu-Windows-*-x64-Setup.exe
            windows/dist/GaoMenHu-Windows-*-x64-Setup.exe.sha256
