name: macOS fixes validation
on:
  push:
    branches: ['codex/macos-fixes-20261128-95e94d2537-full']
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile and run isolated checks
        shell: bash
        run: |
          set -euo pipefail
          export DEVELOPER_DIR=/Applications/Xcode_26.3.app/Contents/Developer
          test -x "$DEVELOPER_DIR/usr/bin/xcodebuild"
          xcodebuild -version
          ./Scripts/build.sh --verify-compile
          ./Scripts/test.sh
          bash Scripts/test-embedded-download-core.sh
          bash Scripts/test-embedded-mail-core.sh
          bash Scripts/test-mail-draft-autosave.sh
