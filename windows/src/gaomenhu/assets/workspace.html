  <div class="app-shell workspace-shell">
    <aside class="sidebar" id="portalSidebar" aria-label="主导航">
      <div class="brand"><img src="/portal-assets/Mark.png" alt=""><strong>搞门户</strong></div>
      <nav class="sidebar-navigation" aria-label="门户导航">
        <div class="workspace-nav-group">
          <div class="nav-section-label">工作区</div>
          <button type="button" class="nav-item selected" id="launcherButton" aria-current="page" aria-label="网站启动台" title="网站启动台"><span id="launcherSymbol"></span><span>网站启动台</span><span class="nav-count" id="siteCount"></span></button>
          <button type="button" class="nav-item" id="workspacesButton" aria-label="工作场景" title="工作场景" disabled><span id="workspacesSymbol"></span><span>工作场景</span><span class="nav-count" id="workspaceCount"></span></button>
          <button type="button" class="nav-item" id="vaultButton" aria-label="账号库" title="账号库" disabled><span id="vaultSymbol"></span><span>账号库</span><span class="nav-count" id="accountCount"></span></button>
        </div>
        <div class="workspace-nav-group">
          <div class="nav-section-label">独立窗口</div>
          <button type="button" class="nav-item" id="downloadsButton" aria-label="下载中心" title="下载中心"><span aria-hidden="true"><svg viewBox="0 0 20 20"><path d="M10 3v9m-4-4 4 4 4-4M4 13v3h12v-3"/></svg></span><span>下载中心</span></button>
          <button type="button" class="nav-item" id="mailButton" aria-label="邮件中心" title="邮件中心"><span aria-hidden="true"><svg viewBox="0 0 20 20"><rect x="3" y="5" width="14" height="10" rx="1.5"/><path d="m4 6 6 5 6-5"/></svg></span><span>邮件中心</span></button>
        </div>
      </nav>
      <div class="sidebar-bottom">
        <button type="button" class="nav-item" id="settingsButton" aria-label="设置" title="设置（Ctrl + ,）"><span id="settingsSymbol"></span><span>设置</span><span class="nav-key" aria-hidden="true">Ctrl + ,</span></button>
        <span class="version" id="version"></span>
      </div>
    </aside>
    <div class="main-column">
      <header class="main-toolbar">
        <div class="page-heading">
          <button class="icon-button" id="workspaceSidebarToggle" type="button" aria-controls="portalSidebar" aria-expanded="true" aria-label="切换主导航" title="切换主导航（Ctrl + Alt + S）"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="4" width="14" height="12" rx="2"/><path d="M8 4v12"/></svg></button>
          <h1 id="pageTitle">网站启动台</h1><p id="pageSubtitle" hidden></p>
        </div>
        <div class="header-actions">
          <button class="workspace-lock" id="lockButton" type="button" disabled><span>账号库</span></button>
          <button class="icon-button" id="fullButton" aria-label="切换全屏" title="切换全屏"></button>
          <button class="add-button" id="addButton" type="button" disabled><span>＋</span> 添加网站</button>
        </div>
      </header>
      <div id="recoveryNotice" class="recovery-notice" role="alert" hidden></div>
      <main id="launcherPage" aria-labelledby="pageTitle" data-empty>
        <div class="launcher-tools">
          <div class="search-wrap"><span id="searchSymbol"></span><input id="search" type="search" autocomplete="off" placeholder="搜索网站、拼音、简称或网址" aria-label="搜索网站"><kbd aria-hidden="true">Ctrl + F</kbd></div>
          <div class="toolbar-actions">
            <button class="tool-button" id="undoButton" title="撤销上次整理（Ctrl + Z）" disabled><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m8 5-4 4 4 4M4 9h8a4 4 0 0 1 0 8"/></svg><span>撤销</span></button>
            <button class="tool-button" id="manageButton" type="button" aria-pressed="false" disabled><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7 5h9M7 10h9m-9 5h9M4 5h.01M4 10h.01M4 15h.01" stroke-width="1.85"/></svg><span>整理</span></button>
          </div>
        </div>
        <div class="launcher-surface">
          <div class="grid-caption"><h2 id="caption">我的网站</h2><span id="count" role="status" aria-live="polite"></span></div>
          <section class="launch-area" id="launchArea" aria-label="网站启动台">
            <div class="grid" id="grid"></div><div class="empty" id="empty" hidden></div>
            <div class="workspace-startup" id="workspaceStartup" role="status"><span class="workspace-spinner" aria-hidden="true"></span>正在加载网站资料…</div>
            <div class="edge-hint edge-left" id="edgeLeft" aria-hidden="true">‹</div><div class="edge-hint edge-right" id="edgeRight" aria-hidden="true">›</div>
          </section>
          <div class="workspace-footer">
            <div class="organize-hint"><span id="dragSymbol"></span><span>拖动可排序或分组</span><span class="paging-hint" id="pagingHint">· Page Up / Down 翻页</span></div>
            <nav class="pagination" id="pagination" aria-label="启动台分页" hidden>
              <button class="page-arrow" id="previousPage" type="button" aria-label="上一页" title="上一页（Page Up）"><span aria-hidden="true">‹</span></button>
              <div class="page-dots" id="pageDots"></div><span class="page-number" id="pageNumber" role="status" aria-live="polite" aria-atomic="true"></span>
              <button class="page-arrow" id="nextPage" type="button" aria-label="下一页" title="下一页（Page Down）"><span aria-hidden="true">›</span></button>
            </nav>
          </div>
        </div>
      </main>
      <section id="sectionPage" class="section-page" aria-labelledby="pageTitle" hidden></section>
    </div>
  </div>
